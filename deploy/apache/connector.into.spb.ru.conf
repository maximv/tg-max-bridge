# Apache vhost для MAX webhook бота tg-max-bridge.
#
# Файл рассчитан на CentOS 7 / Apache 2.4 (httpd) и существующий nextcloud
# на 80 порту. Чтобы НИЧЕГО не сломать, у каждого VirtualHost явно прописан
# ServerName — Apache отдаёт запрос только своему vhost'у, остальные домены
# (включая nextcloud) продолжат работать как раньше.
#
# Установка:
#   1) sudo cp connector.into.spb.ru.conf /etc/httpd/conf.d/
#   2) sudo httpd -t && sudo systemctl reload httpd
#   3) sudo certbot --apache -d connector.into.spb.ru
#      (certbot сам допишет SSL-директивы в этот файл или создаст
#       connector.into.spb.ru-le-ssl.conf — это норма)
#   4) sudo systemctl reload httpd
#
# До получения сертификата активным остаётся только блок :80.
# После certbot автоматически появится блок :443 с SSLEngine on.

# --- HTTP: ACME-челленджи + редирект на HTTPS ----------------------------
<VirtualHost *:80>
    ServerName connector.into.spb.ru

    # ACME http-01 challenge для Let's Encrypt (certbot --apache).
    # Файлы сюда кладёт сам certbot, нам ничего настраивать не нужно.
    DocumentRoot /var/www/html

    # Всё остальное — на HTTPS.
    # ВАЖНО: для домена connector.into.spb.ru.
    # Nextcloud на 80 порту слушает другой ServerName и этот редирект
    # его не затронет.
    RewriteEngine On
    RewriteCond %{HTTPS} !=on
    RewriteCond %{REQUEST_URI} !^/.well-known/acme-challenge/
    RewriteRule ^/?(.*)$ https://%{SERVER_NAME}/$1 [R=301,L]

    ErrorLog  /var/log/httpd/connector.into.spb.ru-error.log
    CustomLog /var/log/httpd/connector.into.spb.ru-access.log combined
</VirtualHost>


# --- HTTPS: reverse proxy на бот в Docker (127.0.0.1:8080) ---------------
# Этот блок начинает работать после того, как certbot выпустит сертификат.
# Если certbot уже отработал, замените пути fullchain/privkey, если нужно,
# и раскомментируйте блок целиком.
#
# <IfModule mod_ssl.c>
# <VirtualHost *:443>
#     ServerName connector.into.spb.ru
#
#     # --- TLS ---
#     SSLEngine on
#     SSLCertificateFile      /etc/letsencrypt/live/connector.into.spb.ru/fullchain.pem
#     SSLCertificateKeyFile   /etc/letsencrypt/live/connector.into.spb.ru/privkey.pem
#     # certbot подтянет include-файл с актуальными протоколами и шифрами:
#     Include /etc/letsencrypt/options-ssl-apache.conf
#
#     # --- Reverse proxy на контейнер бота ---
#     # MAX_WEBHOOK_PUBLIC_URL=https://connector.into.spb.ru/max/webhook
#     # Бот слушает на /max/webhook (берёт path из MAX_WEBHOOK_PUBLIC_URL).
#     ProxyPreserveHost On
#     ProxyRequests Off
#
#     # Узкий проброс только нужного пути — на всякий случай мало ли что
#     # ещё захочется отдавать с этого домена.
#     <Location /max/webhook>
#         ProxyPass        http://127.0.0.1:8080/max/webhook
#         ProxyPassReverse http://127.0.0.1:8080/max/webhook
#         # MAX отправляет POST с JSON, ограничений по размеру не ставим
#         # (картинки/файлы внутри webhook не передаются — там только URL).
#         Require all granted
#     </Location>
#
#     # Health-эндпоинт (если когда-то добавится) — закрыт по умолчанию.
#     # Нечего смотреть на корне — отдаём 404, чтобы не палить, что тут что-то есть.
#     RedirectMatch 404 ^/$
#
#     ErrorLog  /var/log/httpd/connector.into.spb.ru-ssl-error.log
#     CustomLog /var/log/httpd/connector.into.spb.ru-ssl-access.log combined
# </VirtualHost>
# </IfModule>

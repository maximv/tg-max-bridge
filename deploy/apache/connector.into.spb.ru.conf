# HTTP-vhost для connector.into.spb.ru:
#   - принимает ACME http-01 challenge на /.well-known/acme-challenge/
#   - всё остальное редиректит на HTTPS
#
# ServerName указан явно, поэтому другие vhost'ы (Nextcloud и т.п.)
# на 80 порту продолжат работать как работали — Apache 2.4 направляет
# запрос в нужный vhost по Host-заголовку.
#
# Установка:
#   sudo cp connector.into.spb.ru.conf /etc/httpd/conf.d/
#   sudo httpd -t && sudo systemctl reload httpd

<VirtualHost *:80>
    ServerName connector.into.spb.ru

    DocumentRoot /var/www/html

    # ACME-челленджи отдаём напрямую (для certbot --webroot и автообновления)
    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    <Directory "/var/www/html/.well-known/acme-challenge/">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    # Всё остальное — на HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} !=on
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^/?(.*)$ https://%{SERVER_NAME}/$1 [R=301,L]

    ErrorLog  /var/log/httpd/connector.into.spb.ru-error.log
    CustomLog /var/log/httpd/connector.into.spb.ru-access.log combined
</VirtualHost>

# HTTPS-vhost для connector.into.spb.ru:
# проксирует /max/webhook на контейнер бота (127.0.0.1:8080).
#
# Подключайте ТОЛЬКО после того, как certbot выпустит сертификат:
#   sudo certbot certonly --webroot -w /var/www/html \
#        -d connector.into.spb.ru \
#        --agree-tos -m you@example.com --non-interactive
#   sudo cp connector.into.spb.ru-ssl.conf /etc/httpd/conf.d/
#   sudo httpd -t && sudo systemctl reload httpd
#
# Перед этим должны быть установлены модули:
#   sudo yum install -y mod_ssl
# (proxy/proxy_http/rewrite/headers в CentOS 7 включены штатно).
#
# ServerName уникален, поэтому другие vhost'ы на 443 порту не пересекаются.

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName connector.into.spb.ru

    # --- TLS ---
    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/connector.into.spb.ru/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/connector.into.spb.ru/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # --- Reverse proxy на контейнер бота ---
    # MAX_WEBHOOK_PUBLIC_URL=https://connector.into.spb.ru/max/webhook
    # Бот слушает на /max/webhook (path берётся из MAX_WEBHOOK_PUBLIC_URL).
    ProxyPreserveHost On
    ProxyRequests Off

    <Location /max/webhook>
        ProxyPass        http://127.0.0.1:8080/max/webhook
        ProxyPassReverse http://127.0.0.1:8080/max/webhook
        Require all granted
    </Location>

    # На корне ничего полезного нет — отдаём 404, чтобы не светить vhost.
    RedirectMatch 404 ^/$

    ErrorLog  /var/log/httpd/connector.into.spb.ru-ssl-error.log
    CustomLog /var/log/httpd/connector.into.spb.ru-ssl-access.log combined
</VirtualHost>
</IfModule>
